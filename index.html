<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vylee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    @font-face {
      font-family: "Alliance No.1";
      src: url("AllianceNo1-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Alliance No.2";
      src: url("AllianceNo2-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: #f4f7f6;
      color: rgb(30, 33, 36);
      font-family:
        "Alliance No.2",
        "Alliance No.1",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Fira Sans",
        "Droid Sans",
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeSpeed;
    }

    .container {
      max-width: 1200px;
      padding: clamp(16px, 4vw, 40px);
    }

    .headline {
      font-size: clamp(20px, 3vw, 24px);
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.25;
      margin-bottom: 20px;
    }

    .ptcom-design__border__1v32dv {
      border-top: 1px solid rgb(170, 170, 170);
      margin-top: 20px;
      max-width: 264px;
    }

    .ptcom-design__localeWrapper__1v32dv {
      display: flex;
      padding-top: 20px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .ptcom-design__locale__1v32dv {
      font-family: "Alliance No.1", system-ui, sans-serif;
      font-size: 16px;
      line-height: 22.8576px;
      color: rgb(30, 33, 36);
      text-decoration: none;
      margin-right: 16px;
      text-transform: uppercase;
    }

    .ptcom-design__locale__1v32dv:hover {
      text-decoration: underline;
    }

    .footer {
      position: fixed;
      bottom: 16px;
      left: 16px;
      font-size: 14px;
      opacity: 0.6;
      font-family: "Alliance No.1", system-ui, sans-serif;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1 class="headline">Rad designs for rad learners.</h1>

    <div class="ptcom-design__localeWrapper__1v32dv ptcom-design__border__1v32dv">
      <a class="ptcom-design__locale__1v32dv" href="https://github.com/sreemanrp">Github</a>
      <a class="ptcom-design__locale__1v32dv" href="https://linkedin.com/in/sreemanrp">Linkedin</a>
      <a class="ptcom-design__locale__1v32dv" href="https://x.com/sreemanrp">Twitter</a>
      <a class="ptcom-design__locale__1v32dv" href="/shop">Shop</a>
    </div>
  </main>

  <div class="footer">© 2026 Sreeman Reddy</div>
</body>
</html>
